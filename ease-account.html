<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>マイページ｜Ease</title><link rel="stylesheet" href="ease-ui.css?v=account"><style>main{max-width:1000px;margin:auto;padding:20px}.client-return{display:block;background:#263f48;color:#fff;text-align:center;padding:12px;border-radius:12px;text-decoration:none}.account-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.account-grid .panel{margin:0}.account-state{font-weight:800;font-size:20px;color:var(--brand)}.account-actions{display:flex;gap:14px;flex-wrap:wrap;margin:18px 0}input,select{max-width:100%}@media(max-width:800px){.account-grid{grid-template-columns:1fr}}</style></head><body><main><a class="client-return" href="ease-client.html">← クライアント確認用ページへ戻る</a><header><strong>ease</strong><span>個人ページ（デモ）</span></header><h1 id="heading">マイページ</h1><div class="demo-explainer"><strong>架空IDで試す仮ログインです。</strong> 本人確認やパスワード認証は未接続です。本番の会員情報は扱えません。このブラウザで運営が「面談OKで参加確定」した記録を、マイページとチャットで共有します。別端末とは共有しません。</div><section id="login" class="panel"><h2>確認する会員を選びます</h2><label>会員の種類<select id="role"><option value="female">女性会員</option><option value="male">男性会員</option><option value="operator">運営（確認用）</option></select></label><label>架空の会員ID<select id="member"></select></label><button id="signin">この会員のマイページを開く</button></section><section id="account" hidden><section class="panel"><h2 id="identity"></h2><p id="summary"></p><div class="account-actions"><a id="primary-link" href="ease-members.html#listings">募集案件を見る</a><a id="operator-link" href="ease-interviews.html" hidden>当選者・面談の確認</a><button id="signout" class="secondary">別の会員に切り替える</button></div></section><p id="empty" hidden></p><div id="cases" class="account-grid"></div></section><p id="status" role="status">読み込み中…</p></main><script src="ease-access.js"></script><script src="ease-account.js"></script></body></html>
