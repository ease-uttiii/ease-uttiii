<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>当選後合流チャットの検証記録｜Ease</title><link rel="stylesheet" href="ease-ui.css?v=official-ease-colors"><style>main{max-width:960px;margin:auto;padding:20px}.client-return{display:block;padding:12px;background:#76574f;color:white;text-decoration:none;text-align:center;border-radius:12px}.history-window{background:#eee7df;padding:20px;border:1px solid #e4dcd5;border-radius:18px;height:65vh;min-height:380px;overflow:auto;display:flex;flex-direction:column;gap:14px}.record-message{max-width:88%;align-self:flex-start}.record-message.female{align-self:flex-end}.record-message.operator{align-self:center;max-width:96%}.record-message p{padding:12px 16px;background:white;border-radius:16px;margin:4px 0;white-space:pre-wrap;overflow-wrap:anywhere}.record-message.female p{background:#f8e7df}.record-message.operator p{background:#e7dfd7}.record-message small{font-size:12px;color:#6c6059}.record-controls{display:flex;gap:14px;flex-wrap:wrap}.record-controls label{min-width:200px;flex:1}</style><link rel="stylesheet" href="ease-mobile.css?v=20261127"><link rel="manifest" href="ease.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Ease"><link rel="apple-touch-icon" href="ease-icon-192.png"></head><body><main><a class="client-return" href="ease-client.html">← クライアント確認用ページへ戻る</a><header><strong>ease</strong><span>保存済みの検証記録</span></header><nav class="back-links"><a href="ease-chat.html">← 手動デモのチャットへ戻る</a><a href="ease-simulation.html?results=1">← シミュレーターへ戻る</a></nav><h1>当選後合流チャットの検証記録</h1><p>シミュレーターが実際のチャット処理を通して作った、架空の会話・報告・運営確認の記録です。手動デモのチャットをリセットしても、こちらの検証記録は残ります。</p><div class="demo-explainer">架空データを読むための公開資料です。実会員の会話ではありません。ここからメッセージを送ったり、記録を書き換えたりすることはできません。</div><section class="panel"><div class="record-controls"><label>案件を選ぶ<select id="case-select"></select></label><label>場所・依頼者・案件IDで絞る<input id="query" type="search"></label></div><p id="status" role="status">読み込み中…</p><button id="download" disabled>この案件の会話ログを保存</button></section><section class="panel"><h2 id="case-title"></h2><p id="members"></p><p id="end-state" class="important-notice"></p><div id="messages" class="history-window" role="log" aria-label="検証時のチャット記録" tabindex="0"></div><details><summary>入室制限・終了制限の検証を見る</summary><ul id="checks"></ul></details></section></main><script>
(()=>{const $=id=>document.getElementById(id);let cases=[],all=[],people=new Map(),current;function render(){current=all.find(c=>c.id===$('case-select').value);const root=$('messages');root.replaceChildren();$('checks').replaceChildren();$('download').disabled=!current;if(!current){$('case-title').textContent='該当する案件はありません。';$('members').textContent='';$('end-state').textContent='';return;}const c=current,r=c.result.chat;$('case-title').textContent=c.pref+' / '+c.date+' '+c.hour+' / '+c.id;$('members').textContent='女性：'+c.nickname+' / 男性：'+c.result.winners.map(id=>(people.get(id)?.nickname??id)+'（'+id+'）').join('、')+(c.supervisor?' / '+c.supervisor.nickname:'')+' / 運営';$('end-state').textContent=r.closed?'運営が解散報告を確認し、チャットは終了しています。':'チャット終了は未確認です。';for(const m of r.messages){const item=document.createElement('article');item.className='record-message '+(m.userId==='operator'?'operator':m.userId===c.womanId?'female':'male');const meta=document.createElement('small');meta.textContent=m.name+' / '+new Date(m.at).toLocaleString('ja-JP');const text=document.createElement('p');text.textContent=m.text;item.append(meta,text);root.append(item);}const labels={chat_unapproved_blocked:'面談未承認者は入室不可',chat_nonwinner_blocked:'当選者以外は入室不可',chat_post_close_blocked:'チャット終了後は送信不可'};for(const [action,label]of Object.entries(labels)){const li=document.createElement('li');li.textContent=label+'：'+(r.audit.some(e=>e.action===action)?'確認済み':'未確認');$('checks').append(li);}root.scrollTop=0;}$('query').oninput=()=>{const q=$('query').value.toLowerCase();cases=all.filter(c=>(c.pref+' '+c.nickname+' '+c.id).toLowerCase().includes(q));options();};function options(){const prior=$('case-select').value;$('case-select').replaceChildren(...cases.map(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=c.pref+' / '+c.date+' '+c.hour+' / '+c.nickname;return o;}));if(cases.some(c=>c.id===prior))$('case-select').value=prior;$('status').textContent=cases.length+'件のチャット記録があります。';render();}$('case-select').onchange=render;$('download').onclick=()=>{if(!current)return;const c=current,content='Ease チャット検証記録 '+c.id+'\n\n'+c.result.chat.messages.map(m=>'['+m.at+'] '+m.name+'\n'+m.text).join('\n\n'),url=URL.createObjectURL(new Blob([content],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='ease-chat-verification-'+c.id+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};fetch('ease-bot-result.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('記録の取得に失敗しました');return r.json();}).then(d=>{people=new Map(d.men.map(m=>[m.id,m]));all=d.cases.filter(c=>c.result?.chat?.started);cases=all;options();const id=new URLSearchParams(location.search).get('case');if(cases.some(c=>c.id===id)){$('case-select').value=id;render();}}).catch(e=>$('status').textContent=e.message);})();
</script></body></html>
